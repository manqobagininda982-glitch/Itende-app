<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>MG:SOUNDS Licence Admin</title><style>body{margin:0;background:#0a0e18;color:#f6f8fc;font:15px system-ui;padding:22px}.card{max-width:520px;margin:5vh auto;background:#151e30;border:1px solid #31425d;border-radius:18px;padding:20px}h1{font-size:24px}label{display:block;color:#aab7cc;margin:12px 0 6px;font-size:13px}input{width:100%;box-sizing:border-box;background:#0b1320;color:white;border:1px solid #31425d;border-radius:10px;padding:12px}button{margin-top:15px;padding:12px 16px;border:0;border-radius:10px;background:#54e0a6;font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:#0b1320;padding:12px;border-radius:10px;color:#c9f5df}.muted{color:#aab7cc;font-size:13px;line-height:1.5}</style></head><body><main class="card"><h1>MG:SOUNDS Licence Admin</h1><p class="muted">Private owner tool. The admin secret is sent only to the server and is not saved. Generate keys only after you have confirmed the R100 payment.</p><form id="form"><label>Admin secret</label><input id="secret" type="password" autocomplete="off" required><label>Number of keys (1–50)</label><input id="count" type="number" min="1" max="50" value="1" required><button type="submit">Generate licence keys</button></form><p id="status" class="muted"></p><pre id="output" hidden></pre><p class="muted"><a href="./" style="color:#8cb7ff">Back to ToneMaster</a></p></main><script src="./admin.js"></script></body></html>
